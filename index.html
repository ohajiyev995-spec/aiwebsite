<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Titans Atlas — Home</title>
  <meta name="description" content="A hover-to-reveal compendium of Titans (fan project).">
  <link rel="icon" href="assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=DM+Serif+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <meta property="og:title" content="Titans Atlas">
  <meta property="og:description" content="Explore the Titans with hover-to-reveal details.">
</head>
<body>
  <header class="site-header container">
    <a class="brand" href="index.html">Titans Atlas</a>
    <nav class="nav">
      <a href="index.html" aria-current="page">Home</a>
      <a href="titans.html">Titans</a>
      <a href="about.html">About</a>
      <button id="themeToggle" class="btn">Theme</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="display">Titans Atlas</h1>
      <p class="tagline">A hover-to-reveal compendium of the Nine Titans and notable variants.</p>
      <div class="actions">
        <a class="btn btn-primary" href="titans.html">Explore Titans</a>
        <a class="btn" href="about.html">About</a>
      </div>
    </section>

    <section aria-labelledby="feat">
      <h2 id="feat">Featured Titans</h2>
      <div class="grid three" id="featured">
        <!-- Filled by JS from JSON fallback -->
      </div>
    </section>
  </main>

  <footer class="site-footer container">
    <p>Fan site. *Attack on Titan* IP belongs to its owners.</p>
    <div class="social">
      <a href="https://www.linkedin.com/in/your-handle" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/your-handle" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:you@example.com">Email</a>
    </div>
  </footer>

  <script src="scripts/main.js" defer></script>
  <script>
    // Quick featured tiles from the same fallback data used on titans.html
    document.addEventListener('DOMContentLoaded', async () => {
      const data = await window.TITANS_FALLBACK_DATA();
      const wanted = ['colossal','armored','beast'];
      const subset = data.filter(t => wanted.includes(t.slug));
      const wrap = document.getElementById('featured');
      wrap.innerHTML = subset.map(t => `
        <article class="card">
          <img src="${t.image}" alt="${t.name} silhouette" loading="lazy">
          <h3>${t.name}</h3>
          <p>${t.summary}</p>
          <a class="btn" href="titans.html#${t.slug}">Details</a>
        </article>
      `).join('');
    });
  </script>
</body>
</html>
