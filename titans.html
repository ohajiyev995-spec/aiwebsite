<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Titans Atlas — Titans</title>
  <meta name="description" content="Interactive grid of Titans with hover tooltip and modal.">
  <link rel="icon" href="assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=DM+Serif+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="site-header container">
  <a class="brand" href="index.html">Titans Atlas</a>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="titans.html" aria-current="page">Titans</a>
    <a href="about.html">About</a>
    <button id="themeToggle" class="btn">Theme</button>
  </nav>
</header>

<main class="container">
  <section class="controls" aria-label="Filters">
    <input id="q" class="input" type="search" placeholder="Search name, shifter, ability…" aria-label="Search">
    <select id="category" class="input" aria-label="Category">
      <option value="">All Categories</option>
      <option>Nine</option>
      <option>Variant</option>
      <option>Notable Pure/Abnormal</option>
    </select>
    <select id="type" class="input" aria-label="Type">
      <option value="">All Types</option>
      <option>Founding</option><option>Attack</option><option>Colossal</option>
      <option>Armored</option><option>Female</option><option>Beast</option>
      <option>Jaw</option><option>Cart</option><option>War Hammer</option>
      <option>Pure</option><option>Abnormal</option>
      <option>War Hammer Variant</option><option>Female Variant</option>
      <option>Beast Variant</option><option>Cart Variant</option><option>Jaw Variant</option>
    </select>
    <label class="sr-only" for="heightMin">Min height</label>
    <input id="heightMin" class="input number" type="number" placeholder="Min m" min="0" step="1">
    <label class="sr-only" for="heightMax">Max height</label>
    <input id="heightMax" class="input number" type="number" placeholder="Max m" min="0" step="1">
    <select id="spoilers" class="input" aria-label="Spoilers">
      <option value="none">Spoilers: none</option>
      <option value="low">Spoilers: low</option>
      <option value="medium">Spoilers: medium</option>
    </select>
  </section>

  <section aria-labelledby="gridLabel">
    <h1 id="gridLabel">Titans</h1>
    <div id="titan-grid" class="grid"></div>
    <p id="empty" hidden>No results. Try clearing filters.</p>
  </section>
</main>

<footer class="site-footer container">
  <a href="index.html">Home</a> • <a href="about.html">About</a>
</footer>

<!-- Tooltip (singleton) -->
<div id="tooltip" role="tooltip" class="tooltip" hidden></div>

<!-- Modal -->
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modal__panel" role="document">
    <button class="modal__close" aria-label="Close">&times;</button>
    <h2 id="modalTitle"></h2>
    <img id="modalImg" alt="" loading="lazy">
    <div class="specs">
      <p><strong>Type:</strong> <span id="modalType"></span></p>
      <p><strong>Category:</strong> <span id="modalCategory"></span></p>
      <p><strong>Height:</strong> <span id="modalHeight"></span> m</p>
      <p><strong>Shifters:</strong> <span id="modalShifters"></span></p>
      <p><strong>Abilities:</strong> <span id="modalAbilities"></span></p>
      <p><strong>Weaknesses:</strong> <span id="modalWeaknesses"></span></p>
      <p><strong>First appearance:</strong> <span id="modalFirst"></span></p>
      <p><strong>Affiliations:</strong> <span id="modalAff"></span></p>
      <p><strong>Fun fact:</strong> <span id="modalFun"></span></p>
    </div>
  </div>
</div>

<script src="scripts/main.js" defer></script>
<script src="scripts/titans.js" defer></script>
</body>
</html>
